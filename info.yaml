# Tiny Tapeout project information
project:
  title: "GlassChip V0"
  author: "biubiuliao"
  discord: ""
  description: "Always-on wake controller for smart glasses with IMU, button and voice wake events."
  language: "Verilog"
  clock_hz: 50000000
  tiles: "1x1"

  top_module: "tt_um_biubiuliao_glasschip"

  source_files:
    - "glasschip_core.v"
    - "tt_um_biubiuliao_glasschip.v"

pinout:
  # Inputs
  ui[0]: "IMU event"
  ui[1]: "Button event"
  ui[2]: "Voice/AI wake event"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Wake main SoC"
  uo[1]: "Event detected"
  uo[2]: ""
  uo[3]: ""
  uo[4]: "Event counter bit 0"
  uo[5]: "Event counter bit 1"
  uo[6]: "Event counter bit 2"
  uo[7]: "Event counter bit 3"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
